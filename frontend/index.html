<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Grade Calculator</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Student Grade Calculator</h1>
        <p>Calculate your academic performance</p>
    </header>

    <main>

        <section class="calculator">

            <h2>Enter Student Details</h2>

            <form id="gradeForm">

                <label for="studentName">Student Name</label>
                <input type="text" id="studentName"
                       placeholder="Enter your name" required>

                <label for="rollNumber">Roll Number</label>
                <input type="text" id="rollNumber"
                       placeholder="Enter roll number" required>

                <h3>Enter Subject Marks</h3>

                <label for="subject1">Subject 1</label>
                <input type="number" id="subject1"
                       min="0" max="100" required>

                <label for="subject2">Subject 2</label>
                <input type="number" id="subject2"
                       min="0" max="100" required>

                <label for="subject3">Subject 3</label>
                <input type="number" id="subject3"
                       min="0" max="100" required>

                <label for="subject4">Subject 4</label>
                <input type="number" id="subject4"
                       min="0" max="100" required>

                <label for="subject5">Subject 5</label>
                <input type="number" id="subject5"
                       min="0" max="100" required>

                <button type="submit">Calculate Grade</button>
                <button type="reset" class="reset">Reset</button>

            </form>

            <div id="result"></div>

        </section>

    </main>

    <footer>
        <p>Midnight Scholar | Student Grade Calculator</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
